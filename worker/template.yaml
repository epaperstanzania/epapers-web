AWSTemplateFormatVersion: '2010-09-09'
Description: EventBridge Scheduler and least-privilege access for the existing EPapers Lambda worker.

Parameters:
  FunctionName:
    Type: String
    Default: epapers-background-worker
  LambdaExecutionRoleName:
    Type: String
    Description: Existing execution role attached to the Lambda function.
  WorkerSecretArn:
    Type: String
    Description: Secrets Manager ARN containing the worker runtime configuration JSON.
  ScheduleExpression:
    Type: String
    Default: rate(1 minute)

Resources:
  WorkerScheduleRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeEpapersBackgroundWorker
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${FunctionName}

  WorkerSecretReadPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: ReadEpapersWorkerSecret
      Roles:
        - !Ref LambdaExecutionRoleName
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: secretsmanager:GetSecretValue
            Resource: !Ref WorkerSecretArn

  WorkerSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: epapers-background-worker-every-minute
      Description: Invoke the EPapers background worker on a schedule.
      State: ENABLED
      ScheduleExpression: !Ref ScheduleExpression
      FlexibleTimeWindow:
        Mode: OFF
      Target:
        Arn: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${FunctionName}
        RoleArn: !GetAtt WorkerScheduleRole.Arn
        Input: '{"source":"epapers.scheduler","detail-type":"process-background-jobs"}'
        RetryPolicy:
          MaximumEventAgeInSeconds: 3600
          MaximumRetryAttempts: 2

  AllowSchedulerInvokeWorker:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref FunctionName
      Action: lambda:InvokeFunction
      Principal: scheduler.amazonaws.com
      SourceArn: !GetAtt WorkerSchedule.Arn

Outputs:
  ScheduleArn:
    Value: !GetAtt WorkerSchedule.Arn
